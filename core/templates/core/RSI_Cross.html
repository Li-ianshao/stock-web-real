<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>股票分析平台</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script>
            let activeTab = null;
            const stockContentDict = {};

            function addTab() {
                const input = document.getElementById('symbol-input');
                const symbol = input.value.trim().toUpperCase();
                if (!symbol || document.getElementById(`tab-${symbol}`)) return;

                // 建立 tab 元素
                const tabHeader = document.getElementById('tab-header');
                const newTab = document.createElement('div');
                newTab.id = `tab-${symbol}`;
                newTab.className = "relative tab";
                

                newTab.innerHTML = `
                <button onclick="addOrSwitchTab('${symbol}')"
                        class="px-6 py-3 text-sm font-medium rounded-t-xl rounded-b-none shadow-md border border-gray-300 border-b-0 z-10 tabBottom relative -mb-[1px]">
                    ${symbol}
                </button>
                <button onclick="closeTab('${symbol}')"
                        class="absolute top-0.3 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs leading-5 text-center shadow hover:bg-red-600 z-50">
                    ×
                </button>
                `;

                tabHeader.appendChild(newTab);
                input.value = '';
                addOrSwitchTab(symbol)
            }

            function getClassByValue(val, good, bad) {
                if (typeof val === "number" && !isNaN(val)){
                    if (val >= good) return "text-green-600 font-bold";
                    if (val <= bad) return "text-red-600 font-bold";
                }
                return "text-gray-800";
            }
            
            function renderAllStockTags(data,update_time) {
                console.log('data:')
                console.log(data)
                console.log('update_time:')
                console.log(update_time)

                Object.keys(data).forEach(category => {
                    // 確保有一個區域，若沒有自動建立
                    let tagArea = document.getElementById('stock-tag-area-' + category);
                    tagArea.innerHTML = ""; // 先清空
                    // if (!tagArea) {
                    //     // 自動建立區塊並加標題
                    //     tagArea = document.createElement('div');
                    //     tagArea.id = 'stock-tag-area-' + category;
                    //     tagArea.className = "mb-2";
                    //     tagArea.innerHTML = `<div class="text-xs text-gray-500 mb-1">${category}</div>`;
                    //     document.body.appendChild(tagArea); // 你可指定插入在你想要的容器下
                    // } else {
                    //     tagArea.innerHTML = `<div class="text-xs text-gray-500 mb-1">${category}</div>`;
                    // }
                    
                    // 產生標籤
                    data[category].forEach(symbolItem => {
                        const tag = document.createElement('span');
                        tag.className = 'stock-tag cursor-move bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold shadow mr-2 mb-2 inline-block';
                        
                        // dividends 資料有詳細內容可特別處理
                        if (category === "dividends" && typeof symbolItem === "object" && symbolItem.Ticker) {
                            tag.innerText = symbolItem.Ticker;
                            tag.dataset.symbol = symbolItem.Ticker;

                           // ----- 手機長按 -----
                            let pressTimer = null;
                            tag.addEventListener('touchstart', function(e) {
                                pressTimer = setTimeout(function() {
                                    alert(
                                        `除息日: ${symbolItem.Div_Date}\n殖利率: ${symbolItem.Yields}%\nAris: ${symbolItem.Aris}`
                                    );
                                }, 700); // 長按 700ms
                            });
                            tag.addEventListener('touchend', function(e) {
                                clearTimeout(pressTimer);
                            });
                            tag.addEventListener('touchmove', function(e) {
                                clearTimeout(pressTimer); // 滑動視為放棄長按
                            });

                            // ----- 電腦 hover 顯示瀏覽器原生 title -----
                            tag.title = `除息日: ${symbolItem.Div_Date}\n殖利率: ${symbolItem.Yields}%\nAris: ${symbolItem.Aris}`;

                            // 若要同時保留點擊開標籤、長按才顯示訊息，請看下方B方案
                        } else {
                            // RSI 之類直接顯示
                            tag.innerText = symbolItem;
                            tag.dataset.symbol = symbolItem;
                            tag.onclick = function() {
                                addOrSwitchTab(symbolItem);
                            };
                        }

                        tag.draggable = true;
                        tag.ondragstart = function(e) {
                            e.dataTransfer.setData("symbol", tag.dataset.symbol);
                        };
                        tagArea.appendChild(tag);
                        document.getElementById("update-info").innerText = "資料更新時間："+update_time;
                    });
                });
            }

            function handleDrop(e) {
                e.preventDefault();
                const symbol = e.dataTransfer.getData("symbol");
                if (symbol) {
                    addOrSwitchTab(symbol);
                }
            }

            function addOrSwitchTab(symbol) {
                // 標籤樣式管理
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active', 'bg-white', 'font-bold'));
                let tab = document.getElementById(`tab-${symbol}`);
                if (!tab) {
                    // 新增 tab
                    tabHeader = document.getElementById('tab-header');
                    tab = document.createElement('div');
                    tab.id = `tab-${symbol}`;
                    tab.className = "relative tab";
                    

                    tab.innerHTML = `
                    <button onclick="addOrSwitchTab('${symbol}')"
                            class="px-6 py-3 text-sm font-medium rounded-t-xl rounded-b-none shadow-md border border-gray-300 border-b-0 z-10 tabBottom relative -mb-[1px]">
                        ${symbol}
                    </button>

                            class="absolute top-0.3 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs leading-5 text-center shadow hover:bg-red-600 z-50">
                        ×

            function showStockTagArea(type) {
                // 隱藏全部 stock-tag 區
                document.querySelectorAll('.stock-tag-area').forEach(div => div.style.display = 'none');
                // 顯示指定的
                document.getElementById(`stock-tag-area-${type}`).style.display = 'flex';

                // 先全部頁籤 tab 取消 active 樣式
                document.querySelectorAll('.stock-tag-tab').forEach(btn => {
                    btn.classList.remove('bg-white', 'text-gray-700', 'border-b-2', 'border-blue-500', 'font-semibold');
                    btn.classList.add('bg-gray-200', 'text-gray-600');
                });

                // 當前 tab 高亮
                const tabBtn = document.getElementById(`stock-tag-tab-${type}`);
                tabBtn.classList.remove('bg-gray-200', 'text-gray-600');
                tabBtn.classList.add('bg-white', 'text-gray-700', 'border-b-2', 'border-blue-500', 'font-semibold');
            }

            function showLoading() {
                document.getElementById('global-loading').style.display = 'flex';
            }
            function hideLoading() {
                document.getElementById('global-loading').style.display = 'none';
            }

            function closeTab(symbol) {
                const tab = document.getElementById(`tab-${symbol}`);
                if (tab) tab.remove();

                if (activeTab === symbol) {
                    activeTab = null;
                    document.getElementById('tab-content').innerHTML =
                    `<p class="text-gray-500">請新增並點選股票頁籤</p>`;
                }
            }

            .tab {

            margin-right: 2px;
            background: #d1d1d1;
            color: #616161;
            font-size: 15px;
            border: none;
            border-radius: 16px 16px 0 0;
            cursor: pointer;
            position: relative;
            top: 8px;
            box-shadow: none;
            transition: background 0.2s, color 0.2s, top 0.2s;
            z-index: 1;
            }

            .tabBottom{
                background: transparent;
            }

            .tab.active {
            background: #fff;
            color: #222;
            font-weight: 500;
            box-shadow: 0 4px 18px 0 rgba(60, 60, 60, 0.09);
            top: 0;
            z-index: 2;
            border-bottom: 2.5px solid #fff;
            }

            .tab:not(.active):hover {
            background: #e0e0e0;
            color: #444;
            }

            .tab:last-child {
            margin-right: 0;
            }

    <body class="p-6 font-sans bg-gray-100">

        <h1 class="text-2xl font-bold mb-4">股票分析平台</h1>

        <!-- 股票代碼輸入列 + stock tag area 分頁 -->
        <div class="flex items-start mb-6 space-x-3">
            <!-- 股票輸入 + 按鈕 -->
            <div class="flex-shrink-0 flex items-center space-x-3">
                <input id="symbol-input" type="text" placeholder="輸入股票代碼，如 AAPL"
                    class="border border-gray-300 p-3 rounded-lg text-lg w-80 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <button onclick="addTab()"
                    class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full text-2xl shadow-lg flex items-center justify-center">
                    ＋
                </button>
                <button onclick="sendData()"
                    class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full text-2xl shadow-lg flex items-center justify-center">
                    送
                </button>
            </div>
            <!-- stock tag 切換區（占據剩餘空間） -->
            <div class="flex-1 ml-2">
                <!-- 小型頁籤 -->
                <div id="stock-tag-tabs" class="flex space-x-2 mb-2">
                    <button class="stock-tag-tab px-3 py-1 rounded-t bg-white text-gray-700 border-b-2 border-blue-500 font-semibold focus:outline-none" onclick="showStockTagArea('RSI')" id="stock-tag-tab-RSI">RSI_Over_30</button>
                    <button class="stock-tag-tab px-3 py-1 rounded-t bg-gray-200 text-gray-600 font-semibold focus:outline-none" onclick="showStockTagArea('drop')" id="stock-tag-tab-drop">Drop</button>
                    <button class="stock-tag-tab px-3 py-1 rounded-t bg-gray-200 text-gray-600 font-semibold focus:outline-none" onclick="showStockTagArea('dividends')" id="stock-tag-tab-dividends">Divdend</button>
                </div>
                <!-- 各 stock tag 區域（只顯示一個，其餘 hidden） -->
                <div id="stock-tag-area-RSI" class="stock-tag-area flex flex-wrap gap-2 p-2 bg-blue-50 rounded shadow" style="display:block"></div>
                <div id="stock-tag-area-drop" class="stock-tag-area flex flex-wrap gap-2 p-2 bg-green-50 rounded shadow" style="display:none"></div>
                <div id="stock-tag-area-dividends" class="stock-tag-area flex flex-wrap gap-2 p-2 bg-yellow-50 rounded shadow" style="display:none"></div>
                <div id="update-info" class="text-gray-500 mb-2"></div>
            </div>
        </div>
        <!-- Loading 讀取區（預設隱藏）-->
        <div id="global-loading" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50" style="display:none">
            <div class="bg-white rounded-xl px-6 py-4 flex flex-col items-center shadow-xl">
                <svg class="animate-spin h-8 w-8 text-blue-500 mb-2" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                <div class="text-blue-800 text-lg font-semibold">資料載入中，請稍候...</div>
            </div>
        </div>
        <div id="tab-drop-area"
            ondragover="event.preventDefault()"
            ondrop="handleDrop(event)">
            <!-- 導覽列 -->
            <div class="bg-gray-200 px-4 pt-4 pb-1 rounded-t-xl">
                <div id="tab-header" class="flex space-x-2 overflow-x-auto"></div>
            </div>

            <!-- 內容區 -->
            <div id="tab-content" class="bg-white p-6 rounded-b-xl shadow -mt-1">
                <p class="text-gray-500">請新增並點選股票頁籤</p>
            </div>
        </div>
