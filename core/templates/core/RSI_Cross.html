<!DOCTYPE html>
<html>
    <head>

        <title>股票分析平台</title>
        <script src="https://cdn.tailwindcss.com"></script>

        <script>
            let activeTab = null;
            const stockContentDict = {};
            const price_data_saved = {};
            const dividends_saved = {};
            const news_saved = {};
            const heatmap_goal_detail = {};
            const heatmap_div_detail = {};
            
            

            function addTab() {
                const input = document.getElementById('symbol-input');
                const symbol = input.value.trim().toUpperCase();
                if (!symbol || document.getElementById(`tab-${symbol}`)) return;

                // 建立 tab 元素
                const tabHeader = document.getElementById('tab-header');
                const newTab = document.createElement('div');
                newTab.id = `tab-${symbol}`;
                newTab.className = "relative tab";
                

                newTab.innerHTML = `
                <button onclick="addOrSwitchTab('${symbol}')"
                        class="px-6 py-3 text-sm font-medium rounded-t-xl rounded-b-none shadow-md border border-gray-300 border-b-0 z-10 tabBottom relative -mb-[1px]">
                    ${symbol}
                </button>
                <button onclick="closeTab('${symbol}')"
                        class="absolute top-0.3 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs leading-5 text-center shadow hover:bg-red-600 z-50">
                    ×
                </button>
                `;

                tabHeader.appendChild(newTab);
                input.value = '';
                addOrSwitchTab(symbol)
            }

            function getClassByValue(val, good, bad) {
                if (typeof val === "number" && !isNaN(val)){
                    if (val >= good) return "text-green-600 font-bold";
                    if (val <= bad) return "text-red-600 font-bold";
                }
                return "text-gray-800";
            }
            
            function renderAllStockTags(data,update_time) {
                Object.keys(data).forEach(category => {
                    // 確保有一個區域，若沒有自動建立
                    let tagArea = document.getElementById('stock-tag-area-' + category);
                    tagArea.innerHTML = ""; // 先清空
                    // if (!tagArea) {
                    //     // 自動建立區塊並加標題
                    //     tagArea = document.createElement('div');
                    //     tagArea.id = 'stock-tag-area-' + category;
                    //     tagArea.className = "mb-2";
                    //     tagArea.innerHTML = `<div class="text-xs text-gray-500 mb-1">${category}</div>`;
                    //     document.body.appendChild(tagArea); // 你可指定插入在你想要的容器下
                    // } else {
                    //     tagArea.innerHTML = `<div class="text-xs text-gray-500 mb-1">${category}</div>`;
                    // }
                    
                    // 產生標籤
                    data[category].forEach(symbolItem => {
                        const tag = document.createElement('span');
                        tag.className = 'stock-tag cursor-move bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold shadow mr-2 mb-2 inline-block';
                        
                        // 資料有詳細內容可特別處理
                        if ( typeof symbolItem === "object" && symbolItem.Ticker) {
                            tag.innerText = symbolItem.Ticker;
                            tag.dataset.symbol = symbolItem.Ticker;

                            if (symbolItem.股息貴族){
                                if (symbolItem.股息貴族 === "True" || symbolItem.股息貴族 === true) {
                                    tag.className += " bg-green-300 text-white border-2 border-blue-800";
                                }
                            }
                            

                           // ----- 手機長按 -----
                            let pressTimer = null;
                            tag.addEventListener('touchstart', function(e) {
                                pressTimer = setTimeout(function() {
                                    let msg = Object.keys(symbolItem).map(
                                        key => `${key} : ${symbolItem[key]}`
                                    ).join('\n');
                                    alert(msg);
                                }, 700); // 長按 700ms
                            });
                            tag.addEventListener('touchend', function(e) {
                                clearTimeout(pressTimer);
                            });
                            tag.addEventListener('touchmove', function(e) {
                                clearTimeout(pressTimer); // 滑動視為放棄長按
                            });
                            tag.onclick = function() {
                                addOrSwitchTab(symbolItem.Ticker,category);
                            };

                            // ----- 電腦 hover 顯示瀏覽器原生 title -----
                            let msg = Object.keys(symbolItem).map(
                                key => `${key} : ${symbolItem[key]}`
                            ).join('\n');
                            tag.title = msg;

                            // 若要同時保留點擊開標籤、長按才顯示訊息，請看下方B方案
                        } else {
                            // RSI 之類直接顯示
                            tag.innerText = symbolItem;
                            tag.dataset.symbol = symbolItem;
                            tag.onclick = function() {
                                addOrSwitchTab(symbolItem);
                            };
                        }

                        tag.draggable = true;
                        tag.ondragstart = function(e) {
                            e.dataTransfer.setData("symbol", tag.dataset.symbol);
                            e.dataTransfer.setData("category", category);
                        };
                        tagArea.appendChild(tag);
                        document.getElementById("update-info").innerText = "資料更新時間："+update_time;
                    });
                });
            }

            function handleDrop(e) {
                e.preventDefault();
                const symbol = e.dataTransfer.getData("symbol");
                const category = e.dataTransfer.getData("category");
                if (symbol) {
                    addOrSwitchTab(symbol,category);
                }
            }

            function addOrSwitchTab(symbol, category = '') {
                
                // 標籤樣式管理
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active', 'bg-white', 'font-bold'));
                let tab = document.getElementById(`tab-${symbol}`);
                if (!tab) {
                    // 新增 tab
                    tabHeader = document.getElementById('tab-header');
                    tab = document.createElement('div');
                    tab.id = `tab-${symbol}`;
                    tab.className = "relative tab";
                    

                    tab.innerHTML = `
                    <button onclick="addOrSwitchTab('${symbol}')"
                            class="px-6 py-3 text-sm font-medium rounded-t-xl rounded-b-none shadow-md border border-gray-300 border-b-0 z-10 tabBottom relative -mb-[1px]">
                        ${symbol}
                    </button>
                    <button onclick="closeTab('${symbol}')"
                            class="absolute top-0.3 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs leading-5 text-center shadow hover:bg-red-600 z-50">
                        ×

                    `;

                    // tab = document.createElement('button');
                    // tab.className = 'tab px-4 py-2 rounded-t bg-gray-100 font-medium';
                    // tab.id = `tab-${symbol}`;
                    // tab.innerText = symbol;
                    // tab.onclick = () => addOrSwitchTab(symbol);
                    // document.getElementById('tab-header').appendChild(tab);
                }
                tab.classList.add('active', 'bg-white', 'font-bold');

                    dividends = dividends_saved[symbol]
                    news_list = news_saved[symbol]

                    drawMACDChart(priceData);

                    renderDividendTable(heatmap_div_detail[symbol]);

                    document.getElementById('dividend-heatmap-area').style.display = 'none';

                                        </div>
                                    </div>
                                </div>o
                                <!-- 📈 交易量 圖區塊 -->
                                <div x-data="{ open: true }" class="border rounded-lg shadow p-4 bg-white mt-6">
                                    <div class="flex justify-between items-center cursor-pointer mb-2" @click="open = !open">
                                        <div>

            // 安全轉義（避免把原文注入成 HTML）
            function escapeHTML(str = "") {
            return String(str).replace(/[&<>"']/g, s => (
                { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[s]
            ));
            }

            // 友善的日期格式（吃 ISO 或秒數）
            function formatPubDate(pubDate) {
                try {
                    let d;
                    if (typeof pubDate === "number") d = new Date(pubDate * 1000);
                    else d = new Date(pubDate);
                    if (isNaN(d.getTime())) return "";
                    return d.toLocaleString(); // 你要固定格式可改成 toLocaleDateString(...)
                } catch {
                    return "";
                }
            }

            // 主要渲染函式
            function renderNewsArea(newsList, mountId = "news-area") {
            const mount = document.getElementById(mountId);
            if (!mount) return;

            if (!Array.isArray(newsList) || newsList.length === 0) {
                mount.innerHTML = `
                <div class="text-gray-500 text-sm italic px-2 py-3 border rounded">
                    No recent news available.
                </div>`;
                return;
            }

            const html = newsList.map(n => {
                const title     = escapeHTML(n.title_zh);
                const summary   = escapeHTML(n.summary_zh || "");
                const link      = n.link || "#";
                const publisher = escapeHTML(
                (n.provider && n.provider.displayName) ? n.provider.displayName : (n.publisher || "")
                );
                const dateText  = formatPubDate(n.pubDate);

                return `
                <a href="${link}" target="_blank" rel="noopener"
                    class="block border rounded-lg p-4 bg-white hover:shadow transition">
                    <div class="text-base font-semibold text-gray-900 mb-1 line-clamp-2">${title}</div>
                    <div class="text-xs text-gray-500 mb-2">
                    ${publisher ? `${publisher}` : "News"}${dateText ? ` · ${dateText}` : ""}
                    </div>
                    ${summary ? `<div class="text-sm text-gray-700 line-clamp-2">${summary}</div>` : ""}
                </a>
                `;
            }).join("");

            mount.innerHTML = html;
            }

                    .on("mouseleave", cancelSelection)

                let selectionStart = null; // {date, x, y}
                let selectionEnd = null;

                function startSelection(event) {
                    console.log("startSelection")
                    const [mx, my] = getPointer(event, svg.node());
                    const xDate = getNearestDate(mx);
                    selectionStart = { x: mx, y: my, date: xDate };
                    selectionEnd = null;
                    //redrawSelection();
                }

                function updateSelection(event) {
                    if (!selectionStart) return;
                    const [mx, my] = getPointer(event, svg.node());
                    const xDate = getNearestDate(mx);
                    selectionEnd = { x: mx, y: my, date: xDate };
                    //redrawSelection();
                }

                function endSelection(event) {
                    const [mx, my] = getPointer(event, svg.node());
                    const xDate = getNearestDate(mx);
                    selectionEnd = { x: mx, y: my, date: xDate };


                    if (!selectionStart || !selectionEnd) {
                        cancelSelection();
                        return;
                    }
                    
                    // 處理左、右點順序
                    let left = selectionStart, right = selectionEnd;
                    if (selectionStart.x > selectionEnd.x) {
                        left = selectionEnd;
                        right = selectionStart;
                    }
                    console.log(selectionStart)
                    console.log(selectionEnd)
                    console.log(left)
                    console.log(right)
                    const { percent, price1, price2, dateStr1, dateStr2, startIdx, endIdx } = calcReturn(left.date, right.date);
                    showReturnLabel(percent, price1, price2, selectionStart, selectionEnd, startIdx, endIdx, dateStr1, dateStr2);
                    
                }

                function cancelSelection() {
                    selectionStart = null;
                    selectionEnd = null;
                    //redrawSelection();
                }

                function getPointer(event, svgNode) {
                    // 支援滑鼠、觸控
                    if (event.type && event.type.startsWith('touch')) {
                        // touchstart/touchmove 用 event.touches[0]，touchend 用 event.changedTouches[0]
                        let touch;
                        if (event.type === "touchend" && event.changedTouches && event.changedTouches.length) {
                            touch = event.changedTouches[0];
                        } else if (event.touches && event.touches.length) {
                            touch = event.touches[0];
                        }
                        if (touch) {
                            const rect = svgNode.getBoundingClientRect();
                            return [
                                touch.clientX - rect.left,
                                touch.clientY - rect.top
                            ];
                        }
                        // 找不到 touch 時 fallback
                        return [0, 0];
                    } else {
                        // 滑鼠、pen
                        return d3.pointer(event, svgNode);
                    }
                }

                function redrawSelection() {
                    svg.selectAll(".selection-line").remove();
                    svg.selectAll(".selection-dot").remove();
                    svg.selectAll(".selection-label").remove();

                    if (selectionStart && selectionEnd) {
                        svg.append("line")

                                .attr("r", 7)

                        });
                    }
                }

                function calcReturn(date1, date2) {
                    const idx1 = data.findIndex(d => +d.date === +date1);
                    const idx2 = data.findIndex(d => +d.date === +date2);

                    if (idx1 < 0 || idx2 < 0) return {percent: NaN};

                    // 保證 idx1 <= idx2
                    let startIdx = idx1, endIdx = idx2;
                    if (idx1 > idx2) {
                        startIdx = idx2;
                        endIdx = idx1;
                    }

                    const price1 = data[startIdx].Close;
                    const price2 = data[endIdx].Close;
                    const dateStr1 = d3.timeFormat("%Y-%m-%d")(data[startIdx].date);
                    const dateStr2 = d3.timeFormat("%Y-%m-%d")(data[endIdx].date);
                    const percent = ((price2 - price1) / price1 * 100).toFixed(2);

                    return { percent, price1, price2, dateStr1, dateStr2, startIdx, endIdx };
                }

                }

                function getNearestDate(mx) {
                    // mx = 滑鼠在SVG內的x座標
                    const domain = x.domain();
                    const idx = Math.round(mx / x.step());
                    const clampedIdx = Math.max(0, Math.min(idx, domain.length - 1));
                    return domain[clampedIdx];
                }

                    const bisectDate = d3.bisector(d => d.date).left;

            function drawRSIChart(data) {
                const deviceW = Math.max(document.body.clientWidth, window.innerWidth || 0);
                const baseW = Math.max(900, Math.min(deviceW, 1700)); // 保證最小900，最大1700
                const margin = { top: 20, right: 40, bottom: 30, left: 50};

                    .append("g")
                    .attr("transform", `translate(${margin.left},${margin.top})`)

                const parseDate = d3.timeParse("%Y-%m-%d");
                data.forEach(d => {
                    d.date = parseDate(d.Date);
                    d.rsi = +d.rsi;
                });

                const x = d3.scaleBand()
                    .domain(data.map(d => d.date))
                    .range([0, width]);

                const y = d3.scaleLinear()
                    .domain([0, 100])
                    .range([height, 0]);

                // X軸 & Y軸
                const filteredDates = x.domain().filter((d, i) => i % 5 === 0);  // 每隔一個顯示一次
                svg.append("g")
                    .attr("transform", `translate(0,${height})`)
                    .call(
                        d3.axisBottom(x)
                        .tickValues(
                            x.domain().filter((d, i, arr) => {
                            const n = arr.length;
                            return i % Math.ceil(n / 10) === 0; // 最多顯示10個label
                            })
                        )
                        .tickFormat(d3.timeFormat("%m/%d"))
                    );
                svg.append("g")
                    .call(d3.axisLeft(y));

                // RSI 折線
                const rsiLine = d3.line()
                    .defined(d => d.rsi !== null && !isNaN(d.rsi))
                    .x(d => x(d.date) + x.bandwidth() / 2)
                    .y(d => y(d.rsi));

                svg.append("path")
                    .datum(data)

                    .attr("stroke", "purple")
                    .attr("stroke-width", 2)

                // 超買/超賣區
                svg.append("line") // 超買線
                    .attr("x1", 0)
                    .attr("x2", width)
                    .attr("y1", y(70))
                    .attr("y2", y(70))
                    .attr("stroke", "red")
                    .attr("stroke-dasharray", "4 2");

                svg.append("line") // 超賣線
                    .attr("x1", 0)
                    .attr("x2", width)
                    .attr("y1", y(30))
                    .attr("y2", y(30))
                    .attr("stroke", "green")
                    .attr("stroke-dasharray", "4 2");

                svg.selectAll("rsi-cross")
                    .data(data.filter(d => d.RSI_Cross30))
                    .enter()
                    .append("path")
                    .attr("d", d => trianglePath(x(d.date) + x.bandwidth()/2, y(d.rsi) + 30, 14))
                    .attr("fill", "red");

                // 如果要offset在下方顯示標籤文字
                svg.selectAll("rsi-label")
                    .data(data.filter(d => d.RSI_Cross30))
                    .enter()
                    .append("text")
                    .attr("x", d => x(d.date) + x.bandwidth()/2)
                    .attr("y", d => y(d.rsi) + 70) // 24像素下方
                    .attr("text-anchor", "middle")
                    .attr("fill", "red")
                    .attr("font-size", "10px")
                    .attr("transform", d => `rotate(-90, ${x(d.date) + x.bandwidth()/2}, ${y(d.rsi) + 70})`)
                    .text(d => d3.timeFormat("%Y-%m-%d")(d.date));

                // 十字線
                const crosshairV = svg.append("line")
                    .attr("stroke", "#999")
                    .attr("stroke-width", 1)
                    .attr("stroke-dasharray", "3 3")
                    .style("display", "none");

                const crosshairH = svg.append("line")
                    .attr("stroke", "#999")
                    .attr("stroke-width", 1)
                    .attr("stroke-dasharray", "3 3")
                    .style("display", "none");

                // 互動感知區
                svg.append("rect")
                    .attr("width", width)
                    .attr("height", height)
                    .attr("fill", "none")
                    .attr("pointer-events", "all")
                    .on("mousemove", handleMove)
                    .on("touchmove", handleMove)
                    .on("click", handleMove);

                function handleMove(event) {
                    const [mx, my] = d3.pointer(event, svg.node());
                    const bisectDate = d3.bisector(d => d.date).left;
                    const xDate = x.domain()[Math.floor(mx / x.step())];
                    const idx = bisectDate(data, xDate);
                    const d = data[idx];

                    if (!d || d.rsi == null) return;

                    const cx = x(d.date) + x.bandwidth() / 2;
                    const cy = y(d.rsi);

                    crosshairV
                        .attr("x1", cx)
                        .attr("x2", cx)
                        .attr("y1", 0)
                        .attr("y2", height)

                        .attr("x2", width)
                        .attr("y1", cy)
                        .attr("y2", cy)

                    const box = document.getElementById("rsi-tooltip");
                    const boxWidth = 110;  // 你設定的 tooltip 寬度
                    const offset = 10;

                    const svgRect = svg.node().getBoundingClientRect();

                    // 讓 tooltip 出現在滑鼠左側（靠左邊）
                    const leftPos = Math.max(0, mx - boxWidth - offset);  // 不會超出左邊界
                    box.innerHTML = `
                        <div><b>${d3.timeFormat("%Y-%m-%d")(d.date)}</b></div>
                        <div>RSI: ${d.rsi.toFixed(2)}</div>

                    // ✅ 🔽 這段就是讓 tooltip 跟著滑鼠或手指移動
                    box.style.left = `${leftPos+40}px`;
                    box.style.top = `${my + offset-5}px`;
                    box.style.position = "absolute";
                    box.style.pointerEvents = "none";  // 建議加這行避免擋到滑鼠
                    box.classList.remove("hidden");
                }
            }

            function drawMACDChart(data) {
                const deviceW = Math.max(document.body.clientWidth, window.innerWidth || 0);
                const baseW = Math.max(900, Math.min(deviceW, 1700)); // 保證最小900，最大1700
                const margin = { top: 20, right: 40, bottom: 30, left: 50};
                    width = baseW - margin.left - margin.right;
                    height = 600 - margin.top - margin.bottom;
                const svg = d3.select("#chart-macd")
                    .append("svg")
                    .attr("width", "100%")
                    .attr("height", "auto")
                    .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
                    .attr("preserveAspectRatio", "none")
                    .append("g")
                    .attr("transform", `translate(${margin.left},${margin.top})`)

                const parseDate = d3.timeParse("%Y-%m-%d");
                data.forEach(d => {
                    d.date = parseDate(d.Date);
                    d.hist = +d.hist;
                    d.macd = +d.macd;
                    d.signal = +d.signal;
                });

                const x = d3.scaleBand()
                    .domain(data.map(d => d.date))
                    .range([0, width])
                    .padding(0.1);

                const y = d3.scaleLinear()
                    .domain([
                        d3.min(data, d => Math.min(d.hist, d.macd, d.signal, 0)),
                        d3.max(data, d => Math.max(d.hist, d.macd, d.signal, 0))
                    ])
                    .nice()
                    .range([height, 0]);

                // X軸 & Y軸
                const filteredDates = x.domain().filter((d, i) => i % 5 === 0);  // 每隔一個顯示一次
                svg.append("g")
                    .attr("transform", `translate(0,${height})`)
                    .call(
                        d3.axisBottom(x)
                        .tickValues(
                            x.domain().filter((d, i, arr) => {
                            const n = arr.length;
                            return i % Math.ceil(n / 10) === 0; // 最多顯示10個label
                            })
                        )
                        .tickFormat(d3.timeFormat("%m/%d"))
                    );
                svg.append("g")
                    .call(d3.axisLeft(y));

                // 0 軸線
                svg.append("line")
                    .attr("x1", 0)
                    .attr("x2", width)
                    .attr("y1", y(0))
                    .attr("y2", y(0))
                    .attr("stroke", "#aaa")
                    .attr("stroke-dasharray", "3 2");

                // 柱狀圖（hist）
                svg.selectAll("rect")
                    .data(data)
                    .enter()
                    .append("rect")
                    .attr("x", d => x(d.date))
                    .attr("y", d => y(Math.max(0, d.hist)))
                    .attr("width", x.bandwidth())
                    .attr("height", d => Math.abs(y(d.hist) - y(0)))
                    .attr("fill", (d, i) => {
                        if (i === 0 || isNaN(data[i - 1].hist)) return "#ccc";
                        const prev = data[i - 1].hist;
                        // 基準線上方
                        if (d.hist > 0) {
                            if (d.hist > prev) return "#00b300";    // 上方上升：亮綠
                            else return "#007a3d";                  // 上方下跌：暗綠
                        }
                        // 基準線下方
                        else if (d.hist < 0) {
                            if (d.hist > prev) return "#a61b1b";    // 下方上升：暗紅
                            else return "#ff4d4d";                  // 下方下跌：亮紅
                        }
                        // =0
                        else {
                            return "#aaa";
                        }
                    });

                // MACD 曲線
                const macdLine = d3.line()
                    .defined(d => d.macd !== null && !isNaN(d.macd))
                    .x(d => x(d.date) + x.bandwidth() / 2)
                    .y(d => y(d.macd));

                svg.append("path")
                    .datum(data)
                    .attr("fill", "none")
                    .attr("stroke", "purple")
                    .attr("stroke-width", 2)
                    .attr("d", macdLine);

                // Signal 曲線
                const signalLine = d3.line()
                    .defined(d => d.signal !== null && !isNaN(d.signal))
                    .x(d => x(d.date) + x.bandwidth() / 2)
                    .y(d => y(d.signal));

                svg.append("path")
                    .datum(data)
                    .attr("fill", "none")
                    .attr("stroke", "orange")
                    .attr("stroke-width", 2)
                    .attr("d", signalLine);

                // MACD Golden Cross
                svg.selectAll("macd-cross")
                    .data(data.filter(d => d.MACD_GC))
                    .enter()
                    .append("path")
                    .attr("d", d => trianglePath(x(d.date) + x.bandwidth()/2, y(d.macd)+16, 14))
                    .attr("fill", "purple");

                svg.selectAll("macd-cross-label")
                    .data(data.filter(d => d.MACD_GC))
                    .enter()
                    .append("text")
                    .attr("x", d => x(d.date) + x.bandwidth()/2)
                    .attr("y", d => y(d.macd) + 56)
                    .attr("text-anchor", "middle")
                    .attr("fill", "purple")
                    .attr("font-size", 10)
                    .attr("transform", d => `rotate(-90,${x(d.date) + x.bandwidth()/2},${y(d.macd) + 56})`)
                    .text(d => d3.timeFormat("%Y-%m-%d")(d.date));

                // 十字線
                const crosshairV = svg.append("line")
                    .attr("stroke", "#999")
                    .attr("stroke-width", 1)
                    .attr("stroke-dasharray", "3 3")
                    .style("display", "none");

                const crosshairH = svg.append("line")
                    .attr("stroke", "#999")
                    .attr("stroke-width", 1)
                    .attr("stroke-dasharray", "3 3")
                    .style("display", "none");

                // 感知區域
                svg.append("rect")
                    .attr("width", width)
                    .attr("height", height)
                    .attr("fill", "none")
                    .attr("pointer-events", "all")
                    .on("mousemove", handleMove)
                    .on("touchmove", handleMove)
                    .on("click", handleMove);

                function handleMove(event) {
                    const [mx, my] = d3.pointer(event, svg.node());
                    const bisectDate = d3.bisector(d => d.date).left;
                    const xDate = x.domain()[Math.floor(mx / x.step())];
                    const idx = bisectDate(data, xDate);
                    const d = data[idx];
                    
                    if (!d || d.macd == null) return;

                    const cx = x(d.date) + x.bandwidth() / 2;
                    const cy = y(d.hist);

                    crosshairV
                        .attr("x1", cx)
                        .attr("x2", cx)
                        .attr("y1", 0)
                        .attr("y2", height)
                        .style("display", "block");

                    crosshairH
                        .attr("x1", 0)
                        .attr("x2", width)
                        .attr("y1", cy)
                        .attr("y2", cy)
                        .style("display", "block");

                    const box = document.getElementById("macd-tooltip");
                    const boxWidth = 110;  // 你設定的 tooltip 寬度
                    const offset = 10;

                    const svgRect = svg.node().getBoundingClientRect();
                    

                    // 讓 tooltip 出現在滑鼠左側（靠左邊）
                    const leftPos = Math.max(0, mx - boxWidth - offset);  // 不會超出左邊界

                    
                    box.innerHTML = `
                        <div><b>${d3.timeFormat("%Y-%m-%d")(d.date)}</b></div>
                        <div>MACD: ${d.macd.toFixed(2)}</div>
                        <div>Signal: ${d.signal.toFixed(2)}</div>
                        <div>Hist: ${d.hist.toFixed(2)}</div>
                    `;
                    // ✅ 🔽 這段就是讓 tooltip 跟著滑鼠或手指移動
                    box.style.left = `${leftPos+40}px`;
                    box.style.top = `${my + offset-5}px`;
                    box.style.position = "absolute";
                    box.style.pointerEvents = "none";  // 建議加這行避免擋到滑鼠
                    box.classList.remove("hidden");
                }
            }

            function trianglePath(cx, cy, size) {
                // 正三角形頂點
                const h = Math.sqrt(3) / 2 * size;
                return `
                M ${cx},${cy-h/2}
                L ${cx - size/2},${cy + h/2}
                L ${cx + size/2},${cy + h/2}
                Z
                `;
            }

            // 目標達標率表格
            function renderGoalTable(heat_goal_detail) {
                // heat_goal_detail: {天數: {目標報酬: 機率}, ...}
                const area = document.getElementById('goal-table-area');
                area.innerHTML = '';

                // 取得所有天數與報酬目標
                const days = Object.keys(heat_goal_detail).sort((a, b) => +a - +b);
                const goals = new Set();
                days.forEach(day => {
                    Object.keys(heat_goal_detail[day] || {}).forEach(goal => goals.add(goal));
                });
                const goalsArr = Array.from(goals).sort((a, b) => +a - +b);

                // 建表
                let html = `<table class="min-w-full border text-sm"><thead><tr><th class="border p-1">目標%/天數</th>`;
                days.forEach(day => html += `<th class="border p-1">${day}天</th>`);
                html += '</tr></thead><tbody>';
                goalsArr.forEach(goal => {
                    html += `<tr><td class="border p-1">${goal}%</td>`;
                    days.forEach(day => {
                        const val = heat_goal_detail[day]?.[goal] ?? '';
                        html += `<td class="border p-1 text-right">${val === '' ? '-' : (val.toFixed(1) + '%')}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                area.innerHTML = html;
            }

            // 配息後報酬表格
            function renderDividendTable(heat_dividend_detail) {
                // heat_dividend_detail: [ {date, pre_close, max_return_10d, ...}, ... ]
                const area = document.getElementById('dividend-table-area');
                area.innerHTML = '';

                if (!heat_dividend_detail || heat_dividend_detail.length === 0) {
                    area.innerHTML = '<p class="text-gray-500">查無配息日資料。</p>';
                    return;
                }

                // 取得所有 max_return_Nd 欄位
                const example = heat_dividend_detail[0] || {};
                const returnKeys = Object.keys(example).filter(k => k.startsWith('max_return_'));
                returnKeys.sort((a, b) => {
                    // max_return_10d -> 10，max_return_20d -> 20
                    return parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]);
                });

                // 建表
                let html = `<table class="min-w-full border text-sm"><thead><tr>
                    <th class="border p-1">配息日</th>
                    <th class="border p-1">配息前收盤</th>`;
                returnKeys.forEach(k => {
                    html += `<th class="border p-1">${k.replace('max_return_', '').replace('d', '')}天最大漲幅%</th>`;
                });
                html += '</tr></thead><tbody>';

                heat_dividend_detail.forEach(row => {
                    html += `<tr>
                        <td class="border p-1">${row.date}</td>
                        <td class="border p-1 text-right">${row.pre_close?.toFixed(2) ?? '-'}</td>`;
                    returnKeys.forEach(k => {
                        const val = row[k];
                        html += `<td class="border p-1 text-right">${val === undefined ? '-' : (val.toFixed(2) + '%')}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                area.innerHTML = html;
            }

                fetchData();
            });

            function showStockTagArea(type) {
                // 隱藏全部 stock-tag 區
                document.querySelectorAll('.stock-tag-area').forEach(div => div.style.display = 'none');

                tabBtn.classList.add('bg-white', 'text-gray-700', 'border-b-2', 'border-blue-500', 'font-semibold');

                document.getElementById('global-loading').style.display = 'flex';
            }
            function hideLoading() {
                document.getElementById('global-loading').style.display = 'none';

            function closeTab(symbol) {
